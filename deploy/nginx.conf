upstream liga_app { server 127.0.0.1:8130; keepalive 16; }
server {
  listen 80; listen [::]:80;
  server_name liga.steify.com;
  include /etc/nginx/snippets/block-secrets.conf;
  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name liga.steify.com;
  include /etc/nginx/snippets/block-secrets.conf;
  ssl_certificate /etc/letsencrypt/live/liga.steify.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/liga.steify.com/privkey.pem;
  client_max_body_size 2m;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
  location ^~ /static/ {
    alias /var/www/liga/app/liga/static/;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
  }
  location / {
    proxy_pass http://liga_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
