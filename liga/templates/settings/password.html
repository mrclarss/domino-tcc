{% extends "base.html" %}
{% from "macros.html" import topbar, csrf, icon %}
{% block title %}Alterar senha · Liga!{% endblock %}
{% block content %}
{{ topbar("Alterar senha", "teal", url_for('settings.index'), "Troque a senha da conta") }}
<form class="pad stack" method="post" data-verify>
  {{ csrf() }}
  <div class="field-block">
    <label class="field">{{ icon('lock') }}<input data-rule="required" type="password" name="atual" placeholder="senha atual" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">{{ icon('key-round') }}<input data-rule="password" type="password" name="nova" placeholder="nova senha" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">{{ icon('key-round') }}<input data-rule="match" data-match="nova" type="password" name="confirm" placeholder="repetir senha" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <div class="actions-2">
    <a class="btn ghost" href="{{ url_for('settings.index') }}">CANCELAR</a>
    <button class="btn" type="submit" disabled>SALVAR</button>
  </div>
</form>
{% endblock %}
