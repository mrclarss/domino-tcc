{% extends "base.html" %}
{% from "macros.html" import topbar, csrf, icon %}
{% block title %}Alterar e-mail · Liga!{% endblock %}
{% block content %}
{{ topbar("Alterar e-mail", "teal", url_for('settings.index'), "Mude seu email") }}
<form class="pad stack" method="post" data-verify data-check="{{ url_for('auth.available') }}">
  {{ csrf() }}
  <div class="field-block">
    <label class="field">{{ icon('mail') }}<input data-rule="email" data-live="1" type="email" name="email" placeholder="novo e-mail" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">{{ icon('lock') }}<input data-rule="required" type="password" name="senha" placeholder="senha atual" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <a class="text-link" href="{{ url_for('auth.forgot') }}">ESQUECI A SENHA</a>
  <div class="actions-2">
    <a class="btn ghost" href="{{ url_for('settings.index') }}">CANCELAR</a>
    <button class="btn" type="submit" disabled>SALVAR</button>
  </div>
</form>
{% endblock %}
