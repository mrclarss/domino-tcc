{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Cadastro · Liga!{% endblock %}
{% block content %}
<section class="brand compact">
  <img class="logo" src="{{ art('mascote-frasco.png') }}" alt="">
  <h1 class="word"><span>Liga!</span>App</h1>
</section>
<form class="pad stack" method="post" data-verify data-check="{{ url_for('auth.available') }}">
  {{ csrf() }}
  <div class="field-block">
    <label class="field">
      {{ icon('user') }}
      <input name="nome" data-rule="nome" value="{{ form.nome }}" placeholder="seu nome" maxlength="40" autocomplete="name" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">
      {{ icon('at-sign') }}
      <input name="username" data-rule="username" data-live="1" value="{{ form.username }}" placeholder="username" autocomplete="username" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">
      {{ icon('mail') }}
      <input name="email" data-rule="email" data-live="1" value="{{ form.email }}" type="email" placeholder="email" autocomplete="email" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">
      {{ icon('lock') }}
      <input name="password" data-rule="password" type="password" placeholder="senha" autocomplete="new-password" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="links">
    <label><input class="check" type="checkbox" name="lembrar" value="1"> LEMBRAR DE MIM</label>
    <a href="{{ url_for('auth.login') }}">FAÇA LOGIN</a>
  </div>
  <p class="form-status" data-status>Preencha os campos para criar a conta.</p>
  <button class="btn" type="submit" disabled>CADASTRAR</button>
</form>
<div class="pad">
  <a class="btn plain" href="{{ url_for('auth.google') }}">
    <span class="gmark" aria-hidden="true">G</span>
    CONTINUAR COM GOOGLE
  </a>
</div>
{% endblock %}
