{% extends "base.html" %}
{% from "macros.html" import csrf, topbar, icon %}
{% block title %}Nova senha · Liga!{% endblock %}
{% block content %}
{{ topbar("Nova senha", "purple", url_for('auth.login'), "Escolha uma senha nova") }}
<form class="pad stack" method="post" data-verify>
  {{ csrf() }}
  <div class="field-block">
    <label class="field">{{ icon('key-round') }}<input data-rule="password" type="password" name="password" placeholder="nova senha" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">{{ icon('lock') }}<input data-rule="match" data-match="password" type="password" name="confirm" placeholder="repetir senha" required><span class="tick" aria-hidden="true"></span></label>
    <p class="field-msg"></p>
  </div>
  <p class="form-status" data-status>A senha nova precisa coincidir.</p>
  <button class="btn" type="submit" disabled>SALVAR</button>
</form>
{% endblock %}
