{% extends "base.html" %}
{% from "macros.html" import csrf, topbar, icon %}
{% block title %}Esqueci a senha · Liga!{% endblock %}
{% block content %}
{{ topbar("Esqueceu a senha?", "purple", url_for('auth.login'), "Informe o e-mail ou o usuário") }}
<form class="pad stack" method="post" data-verify>
  {{ csrf() }}
  <div class="field-block">
    <label class="field">
      {{ icon('mail') }}
      <input name="email" data-rule="required" placeholder="email ou usuário" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <button class="btn" type="submit" disabled>ENVIAR CÓDIGO</button>
</form>
{% endblock %}
