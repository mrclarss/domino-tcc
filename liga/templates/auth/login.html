{% extends "base.html" %}
{% from "macros.html" import csrf, icon %}
{% block title %}Entrar · Liga!{% endblock %}
{% block content %}
<section class="brand">
  <img class="logo" src="{{ art('mascote-frasco.png') }}" alt="">
  <h1 class="word"><span>Liga!</span>App</h1>
</section>
<form class="pad stack" method="post" data-verify>
  {{ csrf() }}
  <div class="field-block">
    <label class="field">
      {{ icon('user') }}
      <input name="username" data-rule="required" placeholder="username" autocomplete="username" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="field-block">
    <label class="field">
      {{ icon('lock') }}
      <input name="password" data-rule="required" type="password" placeholder="senha" autocomplete="current-password" required>
      <span class="tick" aria-hidden="true"></span>
    </label>
    <p class="field-msg"></p>
  </div>
  <div class="links">
    <label><input class="check" type="checkbox" name="lembrar" value="1"> LEMBRAR DE MIM</label>
    <a href="{{ url_for('auth.forgot') }}">ESQUECEU A SENHA?</a>
  </div>
  <p class="form-status" data-status>Informe usuário e senha.</p>
  <button class="btn" type="submit" disabled>LOGIN</button>
  <a class="btn ghost" href="{{ url_for('auth.register') }}">CRIAR CONTA</a>
</form>
{% endblock %}
